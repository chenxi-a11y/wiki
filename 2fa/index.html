<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <title>TOTP 验证码生成器</title>
    <style>
        /* 样式部分保持不变 */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input, button {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .totp-code {
            font-size: 2rem;
            margin: 20px 0;
        }
        .time-remaining {
            font-size: 1rem;
            color: #555;
        }
        .copied-alert {
            display: none;
            color: green;
            margin-top: 10px;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background-color: #007bff;
            border-radius: 5px;
            transition: width 1s linear;
        }

        .progress-bar.red {
            background-color: #ff4d4d; /* 红色进度条 */
        }

        .totp-code.red {
            color: #ff4d4d; /* 红色验证码 */
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>TOTP 验证码生成器</h2>
        <input type="text" id="secret" placeholder="输入密钥">
        <input type="number" id="digits" placeholder="数字位数" value="6" min="6" max="8">
        <input type="number" id="interval" placeholder="时间 (秒)" value="30" min="10">
        <div class="totp-code" id="totpCode">------</div>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="time-remaining" id="timeRemaining">刷新时间：30秒</div>
        <button onclick="copyCode()">复制验证码</button>
        <div class="copied-alert" id="copiedAlert">成功复制验证码！</div>
    </div>

    <script src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/jsSHA/2.4.2/sha.js"></script>
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/base32/0.0.6/base32.min.js"></script>
    <script>
        const secretInput = document.getElementById('secret');
        const digitsInput = document.getElementById('digits');
        const intervalInput = document.getElementById('interval');
        const totpCode = document.getElementById('totpCode');
        const timeRemaining = document.getElementById('timeRemaining');
        const copiedAlert = document.getElementById('copiedAlert');

        function base32ToHex(base32) {
            const base32Chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let bits = "";
            let hex = "";

            for (let i = 0; i < base32.length; i++) {
                const val = base32Chars.indexOf(base32.charAt(i).toUpperCase());
                bits += val.toString(2).padStart(5, '0');
            }

            for (let i = 0; i + 4 <= bits.length; i += 4) {
                const chunk = bits.substr(i, 4);
                hex += parseInt(chunk, 2).toString(16);
            }

            return hex;
        }

        function getTOTP(secret, digits, interval) {
            const epoch = Math.round(new Date().getTime() / 1000.0);
            const time = Math.floor(epoch / interval).toString(16).padStart(16, '0');

            const decodedSecret = base32ToHex(secret);

            const hmacObj = new jsSHA('SHA-1', 'HEX');
            hmacObj.setHMACKey(decodedSecret, 'HEX');
            hmacObj.update(time);
            const hmac = hmacObj.getHMAC('HEX');

            const offset = parseInt(hmac.slice(-1), 16);
            const binary = parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff;

            const otp = (binary % Math.pow(10, digits)).toString().padStart(digits, '0');
            return otp;
        }

        function updateTOTP() {
            const secret = secretInput.value;
            const digits = parseInt(digitsInput.value);
            const interval = parseInt(intervalInput.value);
            if (!secret) {
                totpCode.textContent = "------";
                return;
            }
            const otp = getTOTP(secret, digits, interval);

            totpCode.textContent = otp;

            const epoch = Math.round(new Date().getTime() / 1000.0);
            const remaining = interval - (epoch % interval);
            timeRemaining.textContent = `刷新时间：${remaining}秒`;

            const progressBar = document.getElementById('progressBar');
            const totpCodeElement = document.getElementById('totpCode');

            const progress = (remaining / interval) * 100;
            progressBar.style.width = `${progress}%`;

            if (remaining <= 5) {
                progressBar.classList.add('red');
                totpCodeElement.classList.add('red');
            } else {
                progressBar.classList.remove('red');
                totpCodeElement.classList.remove('red');
            }

            if (remaining === interval) {
                copiedAlert.style.display = 'none';
            }
        }

        function copyCode() {
            const code = totpCode.textContent;
            navigator.clipboard.writeText(code).then(() => {
                copiedAlert.style.display = 'block';
            });
        }

        function getSecretFromQuery() {
    const urlParams = new URLSearchParams(window.location.search);
    const secret = urlParams.get('secret');
    if (secret) {
        secretInput.value = decodeURIComponent(secret); // 自动填充密钥
    }
}

window.onload = function() {
    getSecretFromQuery();
    updateTOTP();
}


        setInterval(updateTOTP, 1000);
    </script>
</body>
</html>
